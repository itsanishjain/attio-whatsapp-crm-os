# Host port range for this project: 3060-3069
# Other projects on the same Hetzner box use different ranges.
# Inside the compose network, reuse the standard app/baileys ports.
services:
  app:
    build:
      context: ../..
      dockerfile: apps/attio/Dockerfile
      target: app
    container_name: attio-crm-whatsapp-app
    env_file:
      - .env.production
    environment:
      PORT: "3000"
      BAILEYS_SERVICE_URL: "http://baileys:3001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3060:3000"
    depends_on:
      baileys:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res) => { if (!res.ok) throw new Error('health ' + res.status); })",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  baileys:
    build:
      context: ../..
      dockerfile: apps/attio/Dockerfile
      target: baileys
    container_name: attio-crm-whatsapp-baileys
    env_file:
      - .env.production
    environment:
      BAILEYS_SERVICE_PORT: "3001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3061:3001"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((res) => { if (!res.ok) throw new Error('health ' + res.status); })",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: apps/attio/Dockerfile
      target: worker
    container_name: attio-crm-whatsapp-worker
    env_file:
      - .env.production
    environment:
      BAILEYS_SERVICE_URL: "http://baileys:3001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    depends_on:
      baileys:
        condition: service_healthy
